# Builds the portfolio and deploys the static export to GitHub Pages.
#
# The site is a Next.js app exported with `output: 'export'`, so `next build`
# produces a fully static site in `out/` and no server is involved.
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        # Reads the version from the `packageManager` field in package.json,
        # so the CI and local dev always use the same package manager version.
        uses: pnpm/action-setup@v6
      - name: Setup Node
        # `cache: pnpm` caches the pnpm store. setup-node@v7 also has a
        # `package-manager-cache` input that defaults to true, but it only
        # auto-enables for npm, so the explicit cache here is what applies.
        uses: actions/setup-node@v7
        with:
          # Matches the Node version used for local development, so a build that
          # works locally is not broken by a different runtime in CI.
          node-version: "24"
          cache: "pnpm"
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Injects basePath / assetPrefix into next.config.js and disables
          # server-side image optimization. next.config.js must stay a plain
          # object literal assigned to a top-level `nextConfig` constant: this
          # action parses that declaration, and any other export shape makes the
          # step fail.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        # Next 16 removed `next lint`, and with it ESLint stopped running as
        # part of `next build`. Without this step linting would silently stop
        # happening in CI.
        run: pnpm lint
      - name: Build with Next.js
        run: pnpm build
      - name: Install Playwright browsers
        # --with-deps installs the system libraries Chromium needs, which the
        # ubuntu-latest runner does not ship by default.
        run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke tests
        # Runs against the export in out/, so a broken build or broken links
        # stop the deploy instead of shipping.
        run: pnpm exec playwright test
      - name: Upload artifact
        # From v4 onwards this action excludes hidden files (anything starting
        # with a dot) unless `include-hidden-files: true` is set. Nothing in
        # `out/` is hidden today and `.git`/`.github` are always excluded, so the
        # default is fine. Set the flag if a `.nojekyll` is ever needed.
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
